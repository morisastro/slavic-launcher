services:
  - type: web
    name: slavic-launcher-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: ADMIN_KEY
        value: slavic-admin-2024
      - key: DOWNLOAD_URL
        value: https://github.com/morisastro/slavic-launcher/releases/latest
    autoDeploy: true