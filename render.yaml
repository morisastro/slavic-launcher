# Render.com Blueprint for Slavic Launcher backend (PocketBase)
# NOTE: Render free tier has NO persistent disk — data resets on redeploy.
# Use Fly.io instead for production, or upgrade Render for a persistent disk.
#
# Deploy: push to GitHub, connect repo at https://render.com, Render reads this file.

services:
  - type: web
    name: slavic-launcher-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: PB_ADMIN_EMAIL
        sync: false
      - key: PB_ADMIN_PASSWORD
        sync: false
      - key: PB_URL
        value: http://0.0.0.0:8090
    autoDeploy: true
