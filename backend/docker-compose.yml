# Local development with Docker
# Usage: docker compose up
# Then open http://127.0.0.1:8090/_/ for admin panel

services:
  pocketbase:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8090:8090"
    environment:
      - PB_ADMIN_EMAIL=admin@slavic.local
      - PB_ADMIN_PASSWORD=changeme123
      - PB_URL=http://127.0.0.1:8090
    volumes:
      - pb_data:/pb/pb_data

volumes:
  pb_data:
