# Fly.io config for Slavic Launcher backend (PocketBase)
# Free tier: 1 shared-cpu VM + 1GB persistent volume. Perfect for SQLite.
#
# Deploy:
#   flyctl launch --no-build
#   flyctl deploy
#
# First time: flyctl secrets set PB_ADMIN_EMAIL=you@example.com PB_ADMIN_PASSWORD=yourpass

app = "slavic-launcher-backend"
primary_region = "fra"  # Frankfurt — change to your nearest region

[build]
  dockerfile = "backend/Dockerfile"

[http_service]
  internal_port = 8090
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

# Persistent volume — keeps SQLite data across deploys
[[mounts]]
  source = "pb_data"
  destination = "/pb/pb_data"

[vm]
  memory = "256mb"
  cpu_kind = "shared"
  cpus = 1
